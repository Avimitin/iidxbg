name: Build and release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 package
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select Rust toolchain' }

      - name: Check formatting
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Plugin formatting check failed' }
          cargo fmt --manifest-path ui/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { throw 'GUI formatting check failed' }

      - name: Test
        run: ./scripts/build.ps1 -CargoArgs @('test', '--locked', '--all-targets')

      - name: Clippy
        run: ./scripts/build.ps1 -CargoArgs @('clippy', '--locked', '--all-targets', '--', '-D', 'warnings')

      - name: Build release
        run: ./scripts/build.ps1

      - name: Test configuration GUI
        run: ./ui/scripts/build.ps1 -CargoArgs @('test', '--release', '--locked')

      - name: Clippy configuration GUI
        run: ./ui/scripts/build.ps1 -CargoArgs @('clippy', '--release', '--locked', '--all-targets', '--', '-D', 'warnings')

      - name: Build configuration GUI
        run: ./ui/scripts/build.ps1 -CargoArgs @('build', '--release', '--locked')

      - name: Check DLL
        run: |
          python scripts/smoke-dll.py target/release/iidxbg.dll
          if ($LASTEXITCODE -ne 0) { throw 'DLL smoke test failed' }

      - name: Package
        id: package
        run: ./scripts/package.ps1

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iidxbg-windows-x64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download ZIP artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: iidxbg-windows-x64
          path: dist

      - name: Publish ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
