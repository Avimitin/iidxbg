[package]
name = "iidxbg-config"
version = "0.1.0"
edition = "2024"
description = "Configuration UI for the iidxbg IIDX artwork plugin"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui-kit = "=0.7.1"
image = { version = "0.25", default-features = false, features = ["bmp", "dds"] }
toml_edit = "0.25"
tempfile = "3"
sha2 = "0.10"
md5 = "0.7"
roxmltree = "0.20"
encoding_rs = "0.8"
texpresso = "2.0.2"
async-channel = "2"
qrcode = { version = "0.14", default-features = false }
iidxbg = { path = ".." }

[build-dependencies]
embed-resource = "=3.0.12"
